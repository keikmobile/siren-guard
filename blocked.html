<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siren Guard</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #333;
      margin: 0 0 0.4rem;
    }
    .site-name {
      font-size: 1.1rem;
      color: #c00;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: 1rem;
      font-weight: bold;
      color: #333;
    }
    .stat-value.over {
      color: #c00;
    }
    .section {
      width: 100%;
      max-width: 420px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fff;
      text-align: left;
    }
    .section-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #444;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 72px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
    }
    .btn-record {
      margin-top: 8px;
      padding: 7px 16px;
      font-size: 0.85rem;
      background: #555;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-record:hover {
      background: #333;
    }
    .recorded-msg {
      font-size: 0.8rem;
      color: #080;
      margin-top: 6px;
      display: none;
    }
    .cooldown-text {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 10px;
    }
    #btn-unblock {
      padding: 10px 24px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    #btn-unblock:disabled {
      background: #bbb;
      cursor: not-allowed;
    }
    #btn-unblock:not(:disabled):hover {
      background: #1558b0;
    }
    .footer {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .reset-time {
      font-size: 0.8rem;
      color: #999;
    }
    .btn-back {
      background: none;
      border: none;
      color: #888;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-back:hover {
      color: #555;
    }
    .time-block-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .time-block-label {
      font-size: 1rem;
      font-weight: bold;
      color: #c00;
    }
    .time-block-range {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="icon">🔱</div>
  <h1>Siren Guard</h1>
  <div class="site-name" id="site-display"></div>
  <div class="stats" id="stats"></div>

  <div class="section">
    <div class="section-label">なぜ今これを開こうとしましたか？</div>
    <textarea id="intent-input" placeholder="理由を入力..."></textarea>
    <br>
    <button class="btn-record" id="btn-record">記録する</button>
    <div class="recorded-msg" id="recorded-msg">記録しました</div>
  </div>

  <div class="section">
    <div class="cooldown-text" id="cooldown-text"></div>
    <button id="btn-unblock" disabled>解除する</button>
  </div>

  <div class="footer">
    <div class="reset-time" id="reset-time"></div>
    <button class="btn-back" onclick="history.back()">戻る</button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>

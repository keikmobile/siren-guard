<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siren Guard</title>
  <style>
    body {
      width: 320px;
      font-family: system-ui, sans-serif;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 1rem;
      margin: 0 0 12px;
    }
    #rule-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
    }
    .rule-item {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .rule-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rule-domain {
      flex: 1;
      font-size: 0.9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rule-count {
      font-size: 0.8rem;
      color: #666;
      white-space: nowrap;
    }
    .rule-count.over-limit {
      color: #c00;
      font-weight: bold;
    }
    .rule-lock {
      font-size: 0.85rem;
      color: #888;
      cursor: default;
    }
    .btn-delete {
      margin-left: auto;
      padding: 4px 10px;
      font-size: 0.8rem;
      background: none;
      color: #c00;
      border: 1px solid #c00;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-delete:hover { background: #fee; }
    #add-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #add-form label {
      font-size: 0.75rem;
      color: #555;
    }
    #add-form input {
      padding: 6px 8px;
      font-size: 0.85rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #btn-add {
      padding: 7px 8px;
      font-size: 0.85rem;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #btn-add:hover {
      background: #1558b0;
    }
    .empty-message {
      color: #888;
      font-size: 0.85rem;
      padding: 4px 0;
    }
    .lock-notice {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }
    #io-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .btn-io {
      flex: 1;
      padding: 5px 8px;
      font-size: 0.8rem;
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-io:hover {
      background: #e0e0e0;
    }
    #import-status {
      font-size: 0.75rem;
      color: #080;
      margin-bottom: 6px;
      min-height: 1em;
    }
    .rule-time-range {
      font-size: 0.72rem;
      color: #888;
      background: #f0f0f0;
      border-radius: 3px;
      padding: 1px 4px;
      white-space: nowrap;
    }
    .rule-time-range.time-blocked {
      color: #c00;
      background: #fee;
    }
    #time-range-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #555;
    }
    #time-range-inputs {
      display: none;
      align-items: center;
      gap: 6px;
    }
    #time-range-inputs input[type="time"] {
      padding: 5px 6px;
      font-size: 0.82rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      flex: 1;
    }
    .btn-edit {
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      font-size: 0.8rem;
      padding: 0 2px;
      line-height: 1;
    }
    .btn-edit:hover { color: #333; }
    .btn-edit:disabled { color: #ccc; cursor: default; }
    .rule-edit-form {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px solid #eee;
    }
    .rule-edit-form.open { display: flex; }
    .edit-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #555;
    }
    .edit-row input[type="number"] {
      width: 56px;
      padding: 4px 6px;
      font-size: 0.82rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .edit-time-inputs {
      display: none;
      align-items: center;
      gap: 6px;
    }
    .edit-time-inputs input[type="time"] {
      flex: 1;
      padding: 4px 5px;
      font-size: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .edit-actions {
      display: flex;
      gap: 6px;
    }
    .btn-edit-save {
      padding: 4px 12px;
      font-size: 0.8rem;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-edit-save:hover { background: #1558b0; }
    .btn-edit-cancel {
      padding: 4px 10px;
      font-size: 0.8rem;
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-edit-cancel:hover { background: #e0e0e0; }
  </style>
</head>
<body>
  <h1>Siren Guard</h1>
  <ul id="rule-list"></ul>
  <div id="io-bar">
    <button class="btn-io" id="btn-export">エクスポート</button>
    <button class="btn-io" id="btn-import">インポート</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
  <div id="import-status"></div>
  <div id="add-form">
    <label for="input-domain">ドメイン</label>
    <input id="input-domain" type="text" placeholder="例: x.com" />
    <label for="input-limit">1日の上限回数</label>
    <input id="input-limit" type="number" min="1" value="3" />
    <div id="time-range-toggle">
      <input type="checkbox" id="enable-time-range">
      <label for="enable-time-range">時間帯制限を設定する</label>
    </div>
    <div id="time-range-inputs">
      <input type="time" id="input-time-start" value="09:00">
      <span>〜</span>
      <input type="time" id="input-time-end" value="22:00">
    </div>
    <button id="btn-add">ルールを追加</button>
    <div class="lock-notice">追加したルールは本日中変更できません</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
